[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg_rule_engine"
version = "0.1.0"
description = "Faithful rule-engine implementation of the GE Marquette 12SL Physician's Guide, with evaluation against clinician-labeled ECG ground truth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arpit Gupta" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1,<7",
    "lxml>=5.2,<6",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "pdfplumber>=0.11,<0.12",
    "rich>=13.7,<14",
    "jinja2>=3.1,<4",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
extract = [
    "openai>=1.40,<2",
    "anthropic>=0.34,<1",
]
distill = [
    "rulefit>=0.3.1,<0.4",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "jupyter>=1.0,<2",
    "ipykernel>=6.29,<7",
]

[project.scripts]
ecg-rule-eval = "ecg_rule_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecg_rule_engine = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
