                      - { kind: threshold, expr: "T_V5_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V5_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_V5_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead V6"
              when:
                kind: any_of
                clauses:
                  - kind: all_of
                    clauses:
