  - name: Abnormal_QRS_T_angle_ped
    manual_page: 111
    description: >
      abs(QRS_axis_deg - T_axis_deg) >= 60 AND (T_axis_deg < 0 OR T_axis_deg > 90);
      age <= 15 y.
    clause:
      kind: all_of
      clauses:
        - { kind: threshold, note: "Pediatric program age gate", expr: "age_years", op: "<=", value: 15 }
        - { kind: threshold, expr: "abs(QRS_axis_deg - T_axis_deg)", op: ">=", value: 60 }
        - kind: any_of
          clauses:
            - { kind: threshold, expr: "T_axis_deg", op: "<", value: 0 }
            - { kind: threshold, expr: "T_axis_deg", op: ">", value: 90 }
