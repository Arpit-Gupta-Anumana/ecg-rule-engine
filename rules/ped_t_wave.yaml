                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V1_mV", op: ">", value: 0 }
                      - { kind: threshold, expr: "T_V1_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V1_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_V1_mV", op: ">=", value: -0.10 }
            - points: 1
