                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V2_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_V2_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead V3"
              when:
                kind: any_of
                clauses:
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V3_mV", op: ">", value: 0 }
                      - { kind: threshold, expr: "T_V3_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V3_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_V3_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead V4"
              when:
                kind: any_of
                clauses:
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V4_mV", op: ">", value: 0 }
                      - { kind: threshold, expr: "T_V4_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_V4_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_V4_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead V5"
              when:
