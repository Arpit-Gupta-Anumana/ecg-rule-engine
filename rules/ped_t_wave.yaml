                    clauses:
                      - { kind: threshold, expr: "T_III_mV", op: ">", value: 0 }
                      - { kind: threshold, expr: "T_III_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_III_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_III_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead aVL"
              when:
                kind: any_of
                clauses:
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_aVL_mV", op: ">", value: 0 }
                      - { kind: threshold, expr: "T_aVL_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_aVL_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_aVL_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead aVF"
              when:
                kind: any_of
                clauses:
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_aVF_mV", op: ">", value: 0 }
                      - { kind: threshold, expr: "T_aVF_mV", op: "<", value: 0.10 }
                  - kind: all_of
                    clauses:
                      - { kind: threshold, expr: "T_aVF_mV", op: "<", value: 0 }
                      - { kind: threshold, expr: "T_aVF_mV", op: ">=", value: -0.10 }
            - points: 1
              note: "Lead V1"
              when:
                kind: any_of
