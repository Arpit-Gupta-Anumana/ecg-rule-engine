disease: SinusRhythm
manual_source: "12SL Physicians Guide v24, §3.7.1.1.4 p.41"
description: >
  Sinus rhythm family. Manual: SBRAD atrial rate 45–59 bpm; NSR/SRTH 60–100 bpm
  (NSR when no rhythm modifiers or only sinus arrhythmia; SRTH when any other
  modifiers); STACH atrial rate over 100 bpm; MSBRAD atrial rate under 45 bpm.
  Manual also requires rigidly coupled P waves and normal P axis.
manual_departure_notes: |
  NSR vs SRTH is not distinguished: the registry does not expose which rhythm
  modifiers are appended to the interpretation.

  "Rigidly coupled P wave" is a beat-to-beat atrial–ventricular association
  requirement from the manual; no corresponding feature exists in the registry.
  Encoding uses atrial_rate_bpm and P_axis_deg only.

  Normal P axis numeric limits are not stated in the quoted manual text. Limits
  P_axis_deg −30° to +90° follow widely cited adult norms (e.g. Surawicz B,
  Knilans TK. Chou's Electrocardiography in Clinical Practice, 6th ed., 2008;
  normal P axis roughly −30° to +90° in frontal plane).
variants:
  - name: MarkedSinusBradycardia
    manual_page: 41
    description: "MSBRAD: atrial rate < 45 bpm; normal P axis (−30..90°) per literature; rigid P coupling not encoded."
    clause:
      kind: all_of
      note: "Atrial rate and P axis only; coupled P waves not available"
      clauses:
        - kind: threshold
          expr: "atrial_rate_bpm"
          op: "<"
          value: 45
        - kind: threshold
          expr: "P_axis_deg"
          op: ">="
          value: -30
        - kind: threshold
          expr: "P_axis_deg"
          op: "<="
          value: 90

  - name: SinusBradycardia
    manual_page: 41
    description: "SBRAD: atrial rate 45–59 bpm; normal P axis per literature."
    clause:
      kind: all_of
      clauses:
        - kind: threshold
          expr: "atrial_rate_bpm"
          op: ">="
          value: 45
        - kind: threshold
          expr: "atrial_rate_bpm"
          op: "<="
          value: 59
        - kind: threshold
          expr: "P_axis_deg"
          op: ">="
          value: -30
        - kind: threshold
          expr: "P_axis_deg"
          op: "<="
          value: 90

  - name: NormalSinusRhythm
    manual_page: 41
    description: >
      NSR/SRTH combined: atrial rate 60–100 bpm (manual distinguishes NSR vs SRTH
      by rhythm modifiers; not available here); normal P axis per literature.
    clause:
      kind: all_of
      clauses:
        - kind: threshold
          expr: "atrial_rate_bpm"
          op: ">="
          value: 60
        - kind: threshold
          expr: "atrial_rate_bpm"
          op: "<="
          value: 100
        - kind: threshold
          expr: "P_axis_deg"
          op: ">="
          value: -30
        - kind: threshold
          expr: "P_axis_deg"
          op: "<="
          value: 90

  - name: SinusTachycardia
    manual_page: 41
    description: "STACH: atrial rate > 100 bpm; normal P axis per literature."
    clause:
      kind: all_of
      clauses:
        - kind: threshold
          expr: "atrial_rate_bpm"
          op: ">"
          value: 100
        - kind: threshold
          expr: "P_axis_deg"
          op: ">="
          value: -30
        - kind: threshold
          expr: "P_axis_deg"
          op: "<="
          value: 90
